name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Flutter 3.44 builds a plugin's own example for iOS only from a directory
# named after the plugin, so every job checks out into one.
defaults:
  run:
    working-directory: adshift_flutter_sdk

# Every job runs on the oldest supported Flutter and on the newest stable one.
jobs:
  dart:
    name: Dart (${{ matrix.flutter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.44.x', '3.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: adshift_flutter_sdk
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - run: flutter pub get
      - name: Format
        if: matrix.flutter == '3.44.x'
        run: dart format --output=none --set-exit-if-changed lib test tool pigeon example/lib example/integration_test
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - name: Generated bridge is up to date
        if: matrix.flutter == '3.44.x'
        run: |
          dart run pigeon --input pigeon/messages.dart
          dart format lib/src/messages.g.dart
          git diff --exit-code

  android:
    name: Android (${{ matrix.flutter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.44.x', '3.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: adshift_flutter_sdk
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - name: Prepare the example
        working-directory: adshift_flutter_sdk/example
        run: flutter build apk --config-only
      - name: Unit tests
        working-directory: adshift_flutter_sdk/example/android
        run: ./gradlew :adshift_flutter_sdk:testDebugUnitTest
      - name: Release build with code shrinking
        working-directory: adshift_flutter_sdk/example
        run: flutter build apk --release --target-platform android-arm64
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Bridge test on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          script: cd adshift_flutter_sdk/example && flutter test integration_test

  ios:
    name: iOS (${{ matrix.flutter }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.44.x', '3.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: adshift_flutter_sdk
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - run: flutter pub get
      - run: dart run tool/fetch_ios_sdk.dart
      - name: Unit tests
        if: matrix.flutter == '3.44.x'
        run: swift test --package-path ios
      - name: Build the example
        working-directory: adshift_flutter_sdk/example
        run: flutter build ios --simulator --debug
      - name: Bridge test on a simulator
        working-directory: adshift_flutter_sdk/example
        run: |
          device=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          runtimes = json.load(sys.stdin)['devices']
          print(next(d['udid'] for name, devices in runtimes.items() if 'iOS' in name for d in devices if 'iPhone' in d['name']))")
          xcrun simctl boot "$device"
          flutter test integration_test -d "$device"

  # The package as an integrator receives it, built in a fresh app.
  package:
    name: Package (${{ matrix.flutter }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.44.x', '3.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: adshift_flutter_sdk
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true
      - run: flutter pub get
      - run: dart run tool/fetch_ios_sdk.dart
      - name: Contents
        run: dart run tool/check_package.dart --stage "$RUNNER_TEMP/package"
      - name: Fresh app, every way of building it
        run: >
          tool/verify_artifact.sh "$RUNNER_TEMP/package" "$(which flutter)"
          android ios-spm ios-pods ios-pods-static ios-pods-libs ios-device ios-duplicate
