name: adshift_flutter_sdk
description: "AdShift SDK for Flutter: mobile attribution, in-app events, deep links, SKAdNetwork and consent."
version: 2.0.0
homepage: https://adshift.com
repository: https://github.com/AdShift/flutter_plugin
documentation: https://dev.adshift.com/docs/flutter-plugin
issue_tracker: https://github.com/AdShift/flutter_plugin/issues
topics:
  - attribution
  - analytics
  - mobile-attribution
  - skadnetwork
  - deep-linking

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  pigeon: ^30.0.4
  crypto: ^3.0.6

flutter:
  plugin:
    platforms:
      android:
        package: com.adshift.adshift_flutter_sdk
        pluginClass: AdshiftFlutterSdkPlugin
      ios:
        pluginClass: AdshiftFlutterSdkPlugin
